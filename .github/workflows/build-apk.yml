
name: Build Advanced Khata APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          PROJECT_DIR=$(find unpacked -type f -name package.json -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: TypeScript check
        run: |
          cd "$PROJECT_DIR"
          npm run typecheck

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          npx expo prebuild --platform android --non-interactive

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-Khata-APK
          path: unpacked/**/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
