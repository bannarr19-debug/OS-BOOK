name: Advanced Khata - Build and Emulator Diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract the same project ZIP used by the build workflow
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | sort | tail -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: No project ZIP found in repository root.'
            exit 1
          fi
          echo "Selected project ZIP: $ZIP_FILE"
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          PROJECT_DIR=$(find unpacked -type f -name package.json -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo 'ERROR: package.json not found inside project ZIP.'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: TypeScript check
        run: |
          cd "$PROJECT_DIR"
          npm run typecheck

      - name: Expo config check
        run: |
          cd "$PROJECT_DIR"
          npx expo config --type public

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Install and launch APK in Android Emulator; capture crash logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 600
          script: |
            set +e
            APK_PATH="$GITHUB_WORKSPACE/$PROJECT_DIR/android/app/build/outputs/apk/release/app-release.apk"
            PACKAGE_NAME="com.advancedkhata.app"
            LOG_DIR="$GITHUB_WORKSPACE/emulator-diagnostics"
            mkdir -p "$LOG_DIR"

            echo "APK_PATH=$APK_PATH" | tee "$LOG_DIR/test-summary.txt"
            if [ ! -f "$APK_PATH" ]; then
              echo 'RESULT=APK_NOT_FOUND' | tee -a "$LOG_DIR/test-summary.txt"
              exit 2
            fi

            adb logcat -c
            adb install -r "$APK_PATH" > "$LOG_DIR/install.txt" 2>&1
            INSTALL_CODE=$?
            echo "INSTALL_EXIT_CODE=$INSTALL_CODE" | tee -a "$LOG_DIR/test-summary.txt"
            cat "$LOG_DIR/install.txt"
            if [ "$INSTALL_CODE" -ne 0 ]; then
              adb logcat -d -v threadtime > "$LOG_DIR/logcat.txt"
              exit 0
            fi

            adb shell monkey -p "$PACKAGE_NAME" -c android.intent.category.LAUNCHER 1 > "$LOG_DIR/launch.txt" 2>&1
            echo "LAUNCH_EXIT_CODE=$?" | tee -a "$LOG_DIR/test-summary.txt"
            sleep 30

            adb shell pidof "$PACKAGE_NAME" > "$LOG_DIR/process-id.txt" 2>&1
            PID_CODE=$?
            echo "PROCESS_CHECK_EXIT_CODE=$PID_CODE" | tee -a "$LOG_DIR/test-summary.txt"
            if [ "$PID_CODE" -eq 0 ]; then
              echo 'RESULT=PROCESS_STILL_RUNNING_AFTER_30_SECONDS' | tee -a "$LOG_DIR/test-summary.txt"
            else
              echo 'RESULT=PROCESS_NOT_RUNNING_AFTER_30_SECONDS_CHECK_LOGCAT' | tee -a "$LOG_DIR/test-summary.txt"
            fi

            adb shell dumpsys activity activities > "$LOG_DIR/activities.txt" 2>&1
            adb logcat -d -v threadtime > "$LOG_DIR/logcat.txt"
            grep -n -E 'FATAL EXCEPTION|AndroidRuntime|Fatal signal|ReactNativeJS|Firebase|com\.advancedkhata\.app' "$LOG_DIR/logcat.txt" > "$LOG_DIR/relevant-logcat.txt" || true

      - name: Upload APK and emulator crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Advanced-Khata-Emulator-Diagnostics
          path: |
            unpacked/**/android/app/build/outputs/apk/release/*.apk
            emulator-diagnostics/
            unpacked/**/android/build/reports/
            unpacked/**/android/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 14
